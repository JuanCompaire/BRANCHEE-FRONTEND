<!DOCTYPE html>
<html lang="en">
<head>
  <title>BRANCHEE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .dropdown-menu.show {
      display: block;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form>
      <h1>TASK DETAILS</h1>

      <div >
        <div class="row">
          <div class="col-3">
            <!--name-->
            <label for="basic-url" class="form-label">Task Name<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <input type="text" class="form-control" style="background: transparent;color:azure;" name="name"  [(ngModel)]="taskDetails.name_task" readonly>
          </div>
          <div class="col-3 ">
            <!--proyect-->
            <label for="basic-url" class="form-label">Proyect<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <input type="text" class="form-control" style="background: transparent;color:azure;" name="proyect"  [(ngModel)]="taskDetails.id_proyecto" readonly>
          </div>

          <div class="col-3">
            <!-- Status -->
            <label for="status" class="form-label">
              STATUS <i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i>
            </label>
            <select [(ngModel)]="taskDetails.estado" name="status" class="form-select">
              <option *ngFor="let option of status_options" [value]="option">
                {{ option }}
              </option>
            </select>
          </div>

          <div class="col-3">
            <!-- Importance -->
            <label for="importance" class="form-label">
              IMPORTANCE <i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i>
            </label>
            <select [(ngModel)]="taskDetails.importancia" name="importance" class="form-select">
              <option *ngFor="let option of import_options" [value]="option">
                {{ option }}
              </option>
            </select>
          </div>

          <br>

          <div class="col-6">
            <!--description-->
            <label for="basic-url" class="form-label">Description<i class="bi bi-person-gear" style="margin-left: 5px;"></i></label>
            <!-- <input type="textarea" class="form-control" style="background: transparent;color:azure;width:auto" name="description"  [(ngModel)]="taskDetails.descripcion"/> -->
             <textarea class="form-control" style="background: transparent;color:azure;width:auto" name="description" [(ngModel)]="taskDetails.descripcion"></textarea>
          </div>
          <div class="col-6">
            <!--photo-->
            <app-lightbox #lightbox></app-lightbox>

            <img style="height: 250px;width: 250px;" [src]="'http://localhost:8080/api/images/' + taskDetails.image" alt="Imagen" (click)="lightbox.openLightbox('http://localhost:8080/api/images/' + taskDetails.image)">
          </div>

          <div class="col-12">
            <!-- USERS ASSIGNED SELECT -->
            <label for="user_assigned" class="form-label">
              USERS ASSIGNED
            </label>

            <select  name="user_assigned" class="form-select" (change)="onUserSelected($event)">
              <option *ngFor="let user of assignedUsers_options " [value]="user.usuarioId">
                {{ user.username }}
              </option>
            </select>
          </div>

          <div class="users-container">
            <div *ngFor="let user of assignedUsers" [class.show]="assignedUsers.length > 0">
              <div class="user-bubble">
                <img src="assets/user_icon.webp"alt="User Icon" class="user-icon">
                <p class="user-info">{{ user.username }}</p>
                <i class="bi bi-trash text-danger" (click)="removeUser(user.usuarioId)" style="cursor: pointer;"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <!--last update date-->
            <label for="basic-url" class="form-label">Last Update Date<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <input type="text" class="form-control" style="background: transparent;color:azure; width: auto;" name="last_update_date"  [(ngModel)]="taskDetails.date_last_update" readonly>
          </div>

          <br>

          <div class="col-6">
            <!--created task date-->
            <label for="basic-url" class="form-label">Create Task Date<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <input type="text" class="form-control" style="background: transparent;color:azure; width: auto;" name="create_task_date"  [(ngModel)]="taskDetails.date_create" readonly>
          </div>

          <div class="col-3">
            <!--user created task-->
            <label for="basic-url" class="form-label">User created task<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <div class="user-bubble">
              <img src="assets/user_icon.webp"alt="User Icon" class="user-icon">
              <p class="user-info">{{user_created_task.username }}</p>
            </div>
          </div>

          <!-- CHATS ARRAY -->
          <div class="chats-container" *ngIf="taskDetails.chats.length > 0">
            <div class="chat-box" *ngFor="let chat of taskDetails.chats">
              <label for="basic-url" class="form-label">DATE CREATED</label>
              <input type="text" class="form-control" style="background: transparent;color:azure; width: auto;" name="date_created" [(ngModel)]="chat.date_create_chat" readonly>

              <label for="basic-url" class="form-label">USER CREATED</label>
              <input type="text" class="form-control" style="background: transparent;color:azure; width: auto;" name="user_created" [(ngModel)]="chat.user_id_created_chat" readonly>

              <label for="basic-url" class="form-label">DESCRIPTION</label>
              <textarea class="form-control" style="background: transparent;color:azure;" name="description" [(ngModel)]="chat.descripcion"></textarea>

              <label for="basic-url" class="form-label" *ngIf="chat.image !==''">IMAGE</label>
              <img [src]="'http://localhost:8080/api/images/' + chat.image" alt="Imagen" *ngIf="chat.image !==''" (click)="lightbox.openLightbox('http://localhost:8080/api/images/' + chat.image)">
            </div>
          </div>

          <!-- CREATE CHAT -->
          <div class="col-12 wrapper" *ngIf="createCommentActivated">
            <!--description-->
            <label for="basic-url" class="form-label">Description</label>
            <textarea class="form-control" style="background: transparent;color:azure;" name="description" [(ngModel)]="chat.descripcion"></textarea>
            <!--photo-->
            <label for="photo" class="form-label">Upload Photo</label>
            <input type="file" class="form-control" id="photo" (change)="onFileSelected($event)" accept="image/*"/>
          </div>


        </div>
      </div>
      <!--BUTTONS-->
      <div class="row">
        <!--CUANDO userIsBoss ES FALSO (Save y Back ocupan la mitad cada uno)-->
        <div  class="input-box col-12 d-flex justify-content-between">
          <!--COMMENT-->
          <button type="submit" class="btn btn-primary w-50 me-2" (click)="createComment()" *ngIf="!createCommentActivated">Create Comment</button>
          <!--SAVE-->
          <button type="submit" class="btn btn-primary w-50 me-2" (click)="editTask()">Save</button>
          <!--BACK-->
          <button type="button" class="btn btn-secondary w-50 ms-2" (click)="goBack()">Back</button>
        </div>

      </div>
    </form>
  </div>
</body>
</html>
