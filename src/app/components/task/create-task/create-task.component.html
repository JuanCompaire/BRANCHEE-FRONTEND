<!DOCTYPE html>
<html lang="en">
<head>
  <title>BRANCHEE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .dropdown-menu.show {
      display: block;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form>
      <h1>TASK CREATE</h1>

      <div >
        <div class="row">
          <div class="col-3">
            <!--name-->
            <label for="basic-url" class="form-label">Task Name<i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i></label>
            <input type="text" class="form-control" style="background: transparent;color:azure;" name="name"  [(ngModel)]="task.name_task" >
          </div>
          <div class="col-3 ">
            <!--proyect-->
            <label for="basic-url" class="form-label">Proyect <i class="bi bi-journal-code" style="margin-left: 5px;"></i></label>
            <input class="form-control" style="background: transparent; color: azure;" name="proyect" [value]="selectedProjectName" readonly (click)="toggleDropdown()"/>
            <ul class="dropdown-menu" [class.show]="isDropDownOpen">
              <li *ngFor="let proyect of proyectList">
                <a
                  class="dropdown-item"
                  (click)="selectProject(proyect)"
                >{{ proyect.name_proyect }}</a>
              </li>
            </ul>
          </div>
          <div class="col-3">
            <!-- Status -->
            <label for="status" class="form-label">
              STATUS <i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i>
            </label>
            <select [(ngModel)]="task.estado" name="status" class="form-select">
              <option *ngFor="let option of status_options" [value]="option">
                {{ option }}
              </option>
            </select>
          </div>

          <div class="col-3">
            <!-- Importance -->
            <label for="importance" class="form-label">
              IMPORTANCE <i class="bi bi-journal-bookmark" style="margin-left: 5px;"></i>
            </label>
            <select [(ngModel)]="task.importancia" name="importance" class="form-select">
              <option *ngFor="let option of import_options" [value]="option">
                {{ option }}
              </option>
            </select>
          </div>

          <div class="col-12">
            <!-- USERS ASSIGNED SELECT -->
            <label for="user_assigned" class="form-label">
              USERS ASSIGNED
            </label>
            <select  name="user_assigned" class="form-select" (change)="onUserSelected($event)">
              <option *ngFor="let user of assignedUsers_options " [value]="user.usuarioId">
                {{ user.username }}
              </option>
            </select>
          </div>

          <div class="users-container">
            <div *ngFor="let user of assignedUsers" [class.show]="assignedUsers.length > 0">
              <div class="user-bubble">
                <img src="assets/user_icon.webp"alt="User Icon" class="user-icon">
                <p class="user-info">{{ user.username }}</p>
                <i class="bi bi-trash text-danger" (click)="removeUser(user.usuarioId)" style="cursor: pointer;"></i>
              </div>
            </div>
          </div>

          <br>

          <div class="col-6">
            <!--description-->
            <label for="basic-url" class="form-label">Description<i class="bi bi-person-gear" style="margin-left: 5px;"></i></label>
            <input type="email" class="form-control" style="background: transparent;color:azure;width:auto" name="description"  [(ngModel)]="task.descripcion"/>
          </div>
          <div class="col-6">
            <!--photo-->
            <label for="photo" class="form-label">Upload Photo</label>
            <input type="file" class="form-control" id="photo" (change)="onFileSelected($event)" accept="image/*"/>
          </div>

        </div>
      </div>
      <!--BUTTONS-->
      <div class="row">
        <!--CUANDO userIsBoss ES FALSO (Save y Back ocupan la mitad cada uno)-->
        <div  class="input-box col-12 d-flex justify-content-between">
          <!--SAVE-->
          <button type="submit" class="btn btn-primary w-50 me-2" (click)="createTask()">Create</button>
          <!--BACK-->
          <button type="button" class="btn btn-secondary w-50 ms-2" (click)="goBack()">Back</button>
        </div>

      </div>
    </form>
  </div>
</body>
</html>
