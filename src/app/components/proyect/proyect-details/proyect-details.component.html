<!DOCTYPE html>
<html lang="en">
<head>
  <title>BRANCHEE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/smoothscroll-polyfill@0.4.4/dist/smoothscroll.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f172a;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .textarea-style {
      background-color: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(55, 65, 81, 0.7);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      min-height: 100px;
      resize: vertical;
      width: 100%;
    }
    .textarea-style:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    .user-chip {
      transition: all 0.2s ease;
    }
    .user-chip:hover {
      background-color: rgba(55, 65, 81, 0.7);
    }
    .task-border {
      border-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Go Back Button -->
    <button (click)="goBack()" class="mb-6 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
      Go Back
    </button>

    <!-- Project Title and ID -->
    <div class="glass-card rounded-xl p-6 mb-6 shadow-lg">
      <div class="text-3xl font-bold text-white text-center mb-2">
        {{proyect_details.name_proyect}}
        <span class="text-sm text-gray-300 ml-2">#{{proyect_details.proyectoId}}</span>
      </div>

      <!-- Project Description Textarea -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-300 mb-2">PROJECT DESCRIPTION</label>
        <textarea class="textarea-style"
                  [(ngModel)]="proyect_details.description"
                  placeholder="Add a project description..."></textarea>
      </div>
    </div>

    <!-- Project Details Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <!-- Project Boss -->
      <div class="glass-card rounded-xl p-6">
        <label class="block text-sm font-medium text-gray-300 mb-3">PROJECT BOSS</label>
        <div class="flex items-center">
          <img src="assets/user_icon.webp" alt="User Icon" class="w-12 h-12 rounded-full mr-4 border-2 border-blue-500">
          <div>
            <p class="text-white font-medium">{{ user_boss.username }}</p>
            <p class="text-xs text-gray-400">Project Lead</p>
          </div>
        </div>
      </div>

      <!-- Created Date -->
      <div class="glass-card rounded-xl p-6">
        <label class="block text-sm font-medium text-gray-300 mb-3">CREATED DATE</label>
        <p class="text-white">{{proyect_details.date_created}}</p>
      </div>
    </div>

    <!-- User Search (only for boss) -->
    <div class="glass-card rounded-xl p-6 mb-6" *ngIf="userIsBoss">
      <label class="block text-sm font-medium text-gray-300 mb-3">ADD USER</label>
      <input type="text" #userSearch
             class="w-full bg-gray-700/50 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"
             placeholder="Search users..."
             (keyup)="searchUser($event)"
             required>
      <ul class="mt-3 bg-gray-700/80 rounded-lg overflow-y-auto max-h-40 shadow-lg border border-gray-600"
          [class.hidden]="user_list.length === 0">
        <li *ngFor="let user of user_list"
            class="p-3 hover:bg-gray-600 cursor-pointer flex items-center border-b border-gray-600 last:border-0"
            (click)="addUser(user,userSearch)">
          <img src="assets/user_icon.webp" alt="User Icon" class="w-8 h-8 rounded-full mr-3 border border-gray-500">
          <div>
            <p class="text-white font-medium">{{ user.username }}</p>
            <p class="text-xs text-gray-400">{{ user.email }}</p>
          </div>
        </li>
      </ul>
    </div>

    <!-- Users List -->
    <div class="glass-card rounded-xl p-6 mb-6" *ngIf="selectedUsers.length > 0">
      <label class="block text-sm font-medium text-gray-300 mb-3">USERS LIST ({{selectedUsers.length}})</label>
      <div class="flex flex-wrap gap-3">
        <div *ngFor="let user of selectedUsers"
             class="user-chip flex items-center bg-gray-700/50 px-4 py-2 rounded-lg border border-gray-600">
          <img src="assets/user_icon.webp" alt="User Icon" class="w-8 h-8 rounded-full mr-3">
          <span class="text-white">{{ user.username }}</span>
          <button *ngIf="userIsBoss"
                  (click)="removeUser(user.usuarioId)"
                  class="ml-3 text-gray-400 hover:text-red-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Tasks List -->
    <div class="glass-card rounded-xl p-6 mb-6" *ngIf="proyect_details.tareas.length > 0">
      <label class="block text-sm font-medium text-gray-300 mb-3">TASKS LIST ({{proyect_details.tareas.length}})</label>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div *ngFor="let task of proyect_details.tareas"
             class="p-4 rounded-lg border task-border cursor-pointer hover:bg-gray-700/30 transition-colors"
             [ngStyle]="{'border-color': getBorderColor(task.estado)}"
             (click)="toTaskDetailsPage(task.tareaId)">
          <p class="text-white font-medium">{{ task.name_task }}</p>
          <p class="text-xs text-gray-300 mt-1">{{ task.estado }}</p>
        </div>
      </div>
    </div>

    <!-- Buttons Section -->
    <div class="space-y-4">
      <!-- Non-Boss Buttons -->
      <div *ngIf="!userIsBoss" class="flex gap-4">
        <button type="button"
                class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors"
                (click)="editProyect()">
          SAVE
        </button>
        <button type="button"
                class="flex-1 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors"
                (click)="goBack()">
          BACK
        </button>
      </div>

      <!-- Boss Buttons -->
      <div *ngIf="userIsBoss" class="space-y-4">
        <button type="button"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors"
                (click)="editProyect()">
          SAVE CHANGES
        </button>
        <div class="flex gap-4">
          <button type="button"
                  class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">
            DELETE PROJECT
          </button>
          <button type="button"
                  class="flex-1 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors"
                  (click)="goBack()">
            BACK
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
